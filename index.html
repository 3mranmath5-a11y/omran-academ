                        return (

                            <div className="course-thumb-2">
                              <span className="course-badge">{c.free ? "مجاني" : "مادة دراسية"}</span>

                    <button className="small-add-btn" onClick={redeemCode}>🔒 فتح المادة</button>
                  </div>
                  {codeError && <div className="code-error">{codeError}</div>}
                </div>
              ) : selectedChannel && channelTab === "discussion" ? (
                <div className="discussion-wrap">
                  <div className="discussion-header">
                    <h2>💬 نقاش {selectedChannel.name}</h2>
                    <div className="discussion-sub">اسأل زمايلك في المادة دي أو ناقش أي استفسار يخص {selectedChannel.name} بس.</div>
                  </div>
                  <div className="discussion-composer">
                    <textarea
                      rows={3}
                      placeholder="اكتب سؤالك أو مشاركتك هنا..."
                      value={newDiscussionText}
                      onChange={(e) => setNewDiscussionText(e.target.value)}
                    />
                    <button className="small-add-btn" disabled={postingDiscussion} onClick={postDiscussion}>
                      {postingDiscussion ? "جاري النشر..." : "📤 نشر"}
                    </button>
                  </div>
                  <div className="discussion-feed">
                    {discussions.filter((d) => d.channel_id === selectedChannelId).length === 0 && (
                      <div className="empty-state">لسه مفيش أي مشاركات في نقاش {selectedChannel.name}. ابدأ إنت!</div>
                    )}
                    {discussions
                      .filter((d) => d.channel_id === selectedChannelId)
                      .map((d) => (
                        <div className="discussion-post" key={d.id}>
                          <div className="discussion-post-head">
                            <div className="discussion-post-name">{d.student_name}</div>
                            <div className="discussion-post-date">
                              {new Date(d.created_at).toLocaleString("ar-EG", { dateStyle: "medium", timeStyle: "short" })}
                            </div>
                            {student.id === d.student_id && (
                              <button className="delete-btn" onClick={() => deleteDiscussion(d.id)} aria-label="حذف المشاركة">🗑</button>
                            )}
                          </div>
                          <div className="discussion-post-body">{d.body}</div>
                        </div>
                      ))}
                  </div>
                </div>
              ) : selectedChannel && channelTab === "ai" ? (
                <div className="ai-tutor-wrap">
                  <div className="discussion-header">
                    <h2>🤖 المساعد الذكي لمادة {selectedChannel.name}</h2>
                    <div className="discussion-sub">اسأل أي سؤال يخص {selectedChannel.name} وهيساعدك تفهمه خطوة بخطوة.</div>
                  </div>
                  <div className="ai-chat-box">
                    {aiMessages.map((m, i) => (
                      <div className={`ai-msg ${m.role === "user" ? "ai-msg-user" : "ai-msg-model"}`} key={i}>
                        {m.content}
                      </div>
                    ))}
                    {aiLoading && <div className="ai-msg-loading">المساعد بيكتب...</div>}
                  </div>
                  <div className="ai-chat-input-row">
                    <input
                      placeholder="اكتب سؤالك هنا..."
                      value={aiInput}
                      onChange={(e) => setAiInput(e.target.value)}
                      onKeyDown={(e) => { if (e.key === "Enter" && !aiLoading) sendAiMessage(); }}
                    />
                    <button className="small-add-btn" disabled={aiLoading} onClick={sendAiMessage}>إرسال</button>
                  </div>
                </div>
              ) : selectedChannel ? (
                <React.Fragment>
                  {(selectedChannel.categories || [])
                    .filter((c) => !c.parent_id)
                    .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0))
                    .map((root) => (
                      <CategoryNode
                        key={root.id}
                        node={root}
                        categories={selectedChannel.categories}
                        lessons={selectedChannel.lessons}
                        depth={0}
                        isAdmin={false}
                        handlers={{
                          renderLesson: (l) => {
                            const done = completedLessonIds.includes(l.id);
                            return (
                              <div className={`lesson-bubble ${done ? "lesson-done" : ""}`} key={l.id}>
                                <div className="lesson-left">
                                  <button className="lesson-play" onClick={() => { setOpenLesson(l); saveLastPosition(selectedChannelId, l.id); }} aria-label="تشغيل">▶</button>
                                  <div>
                                    <div className="lesson-title">{l.title}</div>
                                    <div className="lesson-duration">{l.duration}</div>
                                  </div>
                                </div>
                                <button
                                  className="icon-btn"
                                  title={done ? "اتفرجت عليه" : "علّمه كمكتمل"}
                                  onClick={() => toggleLessonComplete(l)}
                                >{done ? "✅" : "⭕"}</button>
                              </div>
                            );
                          },
                          renderExtra: (node, depth) => {
                            if (depth !== 0) return null;
                            const catMaterials = (selectedChannel.materials || []).filter((m) => m.category === node.name);
                            if (catMaterials.length === 0) return null;
                            return (
                              <div className="materials-box" key={`mat-${node.id}`}>
                                <div className="materials-box-head">📄 ملازم {node.name}</div>
                                {catMaterials.map((m) => (
                                  <div className="material-row" key={m.id}>
                                    <span>📄</span>
                                    <a href={m.url} target="_blank" rel="noreferrer">{m.name}</a>
                                  </div>
                                ))}
                              </div>
                            );
                          },
                        }}
                      />
                    ))}
                </React.Fragment>
              ) : (
                <div className="empty-state">اختار مادة الأول من القائمة.</div>
              )}
            </div>
          </div>
        </div>
      )}

      {openLesson && (
        <VideoPlayerModal
          lesson={openLesson}
          student={student}
          onClose={() => { setOpenLesson(null); saveLastPosition(selectedChannelId, null); }}
          onSecurityEvent={(type, details) => logSecurityEvent(type, details, selectedChannelId)}
        />
      )}

      {showCertificate && selectedChannel && (
        <CertificateModal
          studentName={student.name}
          courseName={selectedChannel.name}
          teacherName={settings.teacherName}
          brandShort={settings.brandShort}
          onClose={() => setShowCertificate(false)}
        />
      )}

      {showDevices && (
        <DevicesPanel
          devices={devices}
          onClose={() => setShowDevices(false)}
          onKick={kickDevice}
          blockedAttempt={blockedAttempt}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<EduPlatformDemo />);
</script>
</body>
</html>
