<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>أكاديمية عمران — نموذج تجريبي</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Changa:wght@400;600;700&family=Reem+Kufi:wght@400;600;700&family=El+Messiri:wght@400;600;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body), sans-serif;
    font-size: 17px;
  }

  :root {
    --bg: #16283D;
    --surface: #1E3A54;
    --surface-2: #27496A;
    --text: #F3F7FB;
    --text-muted: #A9C2D9;
    --accent: #F2B33D;
    --accent-2: #E5533D;
    --line: rgba(243,247,251,0.14);
    --radius: 14px;
    --font-heading: 'Cairo';
    --font-body: 'Tajawal';
  }
  .app-root {
    font-family: var(--font-body), sans-serif;
    background-color: var(--bg);
    background-image:
      url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27640%27%20height%3D%27640%27%20viewBox%3D%270%200%20640%20640%27%3E%3Ctext%20x%3D%2790%27%20y%3D%2790%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27800%27%20font-size%3D%2742%27%20fill%3D%27%23F2B33D%27%20fill-opacity%3D%270.16%27%20transform%3D%27rotate%28-8%2090%2090%29%27%3ECALCULUS%3C%2Ftext%3E%3Ctext%20x%3D%27380%27%20y%3D%27150%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27700%27%20font-size%3D%2730%27%20fill%3D%27%23F3F7FB%27%20fill-opacity%3D%270.07%27%20transform%3D%27rotate%286%20380%20150%29%27%3ESTATISTICS%3C%2Ftext%3E%3Ctext%20x%3D%2740%27%20y%3D%27230%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27700%27%20font-size%3D%2726%27%20fill%3D%27%23F3F7FB%27%20fill-opacity%3D%270.06%27%20transform%3D%27rotate%28-4%2040%20230%29%27%3EALGEBRA%3C%2Ftext%3E%3Ctext%20x%3D%27300%27%20y%3D%27260%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27700%27%20font-size%3D%2722%27%20fill%3D%27%23E5533D%27%20fill-opacity%3D%270.12%27%20transform%3D%27rotate%2810%20300%20260%29%27%3EDERIVATIVE%3C%2Ftext%3E%3Ctext%20x%3D%27520%27%20y%3D%2760%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27700%27%20font-size%3D%2724%27%20fill%3D%27%23F3F7FB%27%20fill-opacity%3D%270.07%27%20transform%3D%27rotate%28-6%20520%2060%29%27%3EINTEGRAL%3C%2Ftext%3E%3Ctext%20x%3D%27470%27%20y%3D%27220%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27600%27%20font-size%3D%2720%27%20fill%3D%27%23F3F7FB%27%20fill-opacity%3D%270.06%27%20transform%3D%27rotate%284%20470%20220%29%27%3EPROBABILITY%3C%2Ftext%3E%3Ctext%20x%3D%2720%27%20y%3D%27340%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27700%27%20font-size%3D%2722%27%20fill%3D%27%23F2B33D%27%20fill-opacity%3D%270.11%27%20transform%3D%27rotate%28-10%2020%20340%29%27%3ELIMITS%3C%2Ftext%3E%3Ctext%20x%3D%27200%27%20y%3D%27340%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27700%27%20font-size%3D%2726%27%20fill%3D%27%23F3F7FB%27%20fill-opacity%3D%270.07%27%20transform%3D%27rotate%288%20200%20340%29%27%3EMATRIX%3C%2Ftext%3E%3Ctext%20x%3D%27360%27%20y%3D%27380%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27600%27%20font-size%3D%2722%27%20fill%3D%27%23F3F7FB%27%20fill-opacity%3D%270.06%27%20transform%3D%27rotate%28-6%20360%20380%29%27%3EGEOMETRY%3C%2Ftext%3E%3Ctext%20x%3D%2760%27%20y%3D%27430%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27600%27%20font-size%3D%2718%27%20fill%3D%27%23F3F7FB%27%20fill-opacity%3D%270.055%27%20transform%3D%27rotate%285%2060%20430%29%27%3ETRIGONOMETRY%3C%2Ftext%3E%3Ctext%20x%3D%27300%27%20y%3D%27460%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27600%27%20font-size%3D%2720%27%20fill%3D%27%23F3F7FB%27%20fill-opacity%3D%270.06%27%20transform%3D%27rotate%28-8%20300%20460%29%27%3ELOGARITHMS%3C%2Ftext%3E%3Ctext%20x%3D%27500%27%20y%3D%27400%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27700%27%20font-size%3D%2724%27%20fill%3D%27%23E5533D%27%20fill-opacity%3D%270.1%27%20transform%3D%27rotate%286%20500%20400%29%27%3EEQUATIONS%3C%2Ftext%3E%3Ctext%20x%3D%2730%27%20y%3D%27520%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27600%27%20font-size%3D%2722%27%20fill%3D%27%23F3F7FB%27%20fill-opacity%3D%270.06%27%20transform%3D%27rotate%28-4%2030%20520%29%27%3EFUNCTIONS%3C%2Ftext%3E%3Ctext%20x%3D%27230%27%20y%3D%27540%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27700%27%20font-size%3D%2728%27%20fill%3D%27%23F2B33D%27%20fill-opacity%3D%270.12%27%20transform%3D%27rotate%288%20230%20540%29%27%3EGRAPHS%3C%2Ftext%3E%3Ctext%20x%3D%27420%27%20y%3D%27540%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27700%27%20font-size%3D%2724%27%20fill%3D%27%23F3F7FB%27%20fill-opacity%3D%270.07%27%20transform%3D%27rotate%28-6%20420%20540%29%27%3EFORMULA%3C%2Ftext%3E%3Ctext%20x%3D%27560%27%20y%3D%27480%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27600%27%20font-size%3D%2718%27%20fill%3D%27%23F3F7FB%27%20fill-opacity%3D%270.055%27%20transform%3D%27rotate%284%20560%20480%29%27%3ENUMBERS%3C%2Ftext%3E%3Ctext%20x%3D%2790%27%20y%3D%27600%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27600%27%20font-size%3D%2718%27%20fill%3D%27%23F3F7FB%27%20fill-opacity%3D%270.05%27%20transform%3D%27rotate%28-6%2090%20600%29%27%3ERATIOS%3C%2Ftext%3E%3Ctext%20x%3D%27250%27%20y%3D%27620%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27600%27%20font-size%3D%2718%27%20fill%3D%27%23F3F7FB%27%20fill-opacity%3D%270.05%27%20transform%3D%27rotate%286%20250%20620%29%27%3EPROOFS%3C%2Ftext%3E%3Ctext%20x%3D%27400%27%20y%3D%27610%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27600%27%20font-size%3D%2720%27%20fill%3D%27%23F3F7FB%27%20fill-opacity%3D%270.055%27%20transform%3D%27rotate%28-4%20400%20610%29%27%3ELINEAR%3C%2Ftext%3E%3Ctext%20x%3D%27550%27%20y%3D%27610%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27600%27%20font-size%3D%2718%27%20fill%3D%27%23F3F7FB%27%20fill-opacity%3D%270.05%27%20transform%3D%27rotate%286%20550%20610%29%27%3EVECTORS%3C%2Ftext%3E%3Ctext%20x%3D%27180%27%20y%3D%2760%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27600%27%20font-size%3D%2720%27%20fill%3D%27%23F3F7FB%27%20fill-opacity%3D%270.055%27%20transform%3D%27rotate%286%20180%2060%29%27%3ELOGIC%3C%2Ftext%3E%3Ctext%20x%3D%27470%27%20y%3D%27300%27%20font-family%3D%27Cairo%2C%20Arial%2C%20sans-serif%27%20font-weight%3D%27800%27%20font-size%3D%2730%27%20fill%3D%27%23F2B33D%27%20fill-opacity%3D%270.1%27%20transform%3D%27rotate%28-10%20470%20300%29%27%3ESTATS%3C%2Ftext%3E%3C%2Fsvg%3E"),
      radial-gradient(circle at 10% 8%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 42%),
      radial-gradient(circle at 90% 15%, color-mix(in srgb, var(--accent-2) 14%, transparent), transparent 38%),
      radial-gradient(circle at 88% 95%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 42%);
    background-size: 640px 640px, 100% 100%, 100% 100%, 100% 100%;
    background-repeat: repeat, no-repeat, no-repeat, no-repeat;
    background-attachment: fixed, fixed, fixed, fixed;
    color: var(--text);
    min-height: 100vh;
    width: 100%;
  }

  /* ---------- Landing ---------- */
  .landing-hero {
    padding: 70px 26px 54px 26px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .math-backdrop {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .blob-illustration {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1;
    flex-shrink: 0;
    justify-self: center;
  }
  .blob-glow {
    position: absolute;
    inset: -12%;
    background:
      radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--accent) 45%, transparent), transparent 65%),
      radial-gradient(circle at 75% 70%, color-mix(in srgb, var(--accent-2) 35%, transparent), transparent 65%);
    filter: blur(28px);
    z-index: 0;
  }
  .blob-shape {
    position: absolute;
    inset: 0;
    box-shadow: 0 24px 50px -12px rgba(0,0,0,0.45);
    animation: blob-float 7s ease-in-out infinite;
  }
  .blob-shape-1 {
    background: linear-gradient(150deg,
      color-mix(in srgb, var(--accent-2) 22%, var(--surface)) 0%,
      var(--surface) 55%,
      color-mix(in srgb, var(--bg) 70%, black 10%) 100%);
    border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%;
    transform: rotate(-6deg);
    --r: -6deg;
  }
  .blob-shape-2 {
    background: linear-gradient(150deg,
      color-mix(in srgb, var(--accent) 26%, var(--surface-2)) 0%,
      var(--surface-2) 55%,
      color-mix(in srgb, var(--surface) 80%, black 5%) 100%);
    border-radius: 58% 42% 37% 63% / 55% 60% 40% 45%;
    inset: 20px;
    transform: rotate(5deg);
    animation-delay: -3.5s;
    --r: 5deg;
  }
  @keyframes blob-float {
    0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); }
    50% { transform: translateY(-8px) rotate(calc(var(--r, 0deg) + 1deg)); }
  }
  .blob-dot {
    position: absolute;
    border-radius: 50%;
    background: var(--accent-2);
    opacity: 0.6;
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent-2) 60%, transparent);
    z-index: 1;
  }
  .blob-dot-1 { width: 22px; height: 22px; top: 6%; left: 8%; }
  .blob-dot-2 {
    width: 12px; height: 12px; bottom: 10%; right: 6%;
    background: var(--accent); opacity: 0.75;
    box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .blob-star {
    position: absolute;
    color: var(--accent);
    opacity: 0.8;
    z-index: 1;
    text-shadow: 0 0 10px color-mix(in srgb, var(--accent) 50%, transparent);
  }
  .blob-star-1 { top: 14%; right: 12%; font-size: 23px; }
  .blob-star-2 { bottom: 16%; left: 10%; font-size: 17px; color: var(--accent-2); text-shadow: 0 0 10px color-mix(in srgb, var(--accent-2) 50%, transparent); }
  .blob-symbol {
    position: absolute;
    top: 8%;
    left: 14%;
    font-family: var(--font-heading), sans-serif;
    font-weight: 800;
    font-size: 25.5px;
    color: color-mix(in srgb, var(--text) 55%, transparent);
    z-index: 1;
  }
  .blob-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: var(--accent);
    text-align: center;
    z-index: 2;
    padding: 20px;
  }
  .blob-brand {
    font-family: var(--font-heading), sans-serif;
    font-weight: 800;
    font-size: 30px;
    color: var(--text);
    text-shadow: 0 2px 10px rgba(0,0,0,0.35);
  }
  .blob-tag {
    font-size: 20px;
    letter-spacing: 1px;
    background: var(--accent);
    color: #16283D;
    padding: 8px 20px;
    border-radius: 24px;
    font-weight: 800;
    box-shadow: 0 8px 20px -6px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .blob-illustration-circle .blob-shape-1,
  .blob-illustration-circle .blob-shape-2 {
    border-radius: 50%;
    transform: none;
  }
  .blob-illustration-rounded .blob-shape-1,
  .blob-illustration-rounded .blob-shape-2 {
    border-radius: 28px;
    transform: none;
  }
  .landing-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 30px;
    border-bottom: 1px solid var(--line);
  }
  .landing-nav-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-heading), sans-serif;
    font-weight: 800;
    font-size: 22px;
  }
  .landing-nav-cta {
    background: var(--accent);
    color: #16283D;
    border: none;
    font-family: var(--font-heading), sans-serif;
    font-weight: 700;
    font-size: 15.5px;
    padding: 9px 18px;
    border-radius: var(--radius);
    cursor: pointer;
  }
  .site-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 18px 30px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .site-nav-links {
    display: flex;
    align-items: center;
    gap: 26px;
  }
  .site-nav-link {
    font-size: 15.5px;
    color: var(--text-muted);
    cursor: pointer;
  }
  .site-nav-link:hover { color: var(--text); }
  .site-nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .site-shell {
    display: flex;
    align-items: flex-start;
    min-height: 100vh;
  }
  .site-sidebar {
    width: 264px;
    flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--line);
    padding: 22px 14px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .sidebar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px 20px 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .sidebar-logo-icon { font-size: 24px; color: var(--accent); }
  .sidebar-logo-text {
    font-family: var(--font-heading), sans-serif;
    font-weight: 800;
    font-size: 17px;
  }
  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sidebar-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: var(--radius);
    color: var(--text-muted);
    font-size: 15px;
    cursor: pointer;
  }
  .sidebar-link:hover { background: var(--surface-2); color: var(--text); }
  .sidebar-link.active { background: var(--accent); color: #16283D; font-weight: 700; }
  .sidebar-link-icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
  .site-main {
    flex: 1;
    min-width: 0;
  }

  .home-hero {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: center;
    gap: clamp(24px, 4vw, 56px);
    padding: 50px 44px;
    max-width: 1180px;
    margin: 0 auto;
    min-height: 50vh;
    overflow: hidden;
  }
  .home-hero-visual {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 260px;
    height: 100%;
  }
  .home-hero-visual-card {
    width: 100%;
    max-width: 460px;
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 30px -8px rgba(0,0,0,0.45);
  }
  .home-hero-visual-img {
    max-width: 100%;
    max-height: 380px;
    width: auto;
    display: block;
    border-radius: calc(var(--radius) - 6px);
    object-fit: contain;
  }
  .home-hero-text-stack {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .home-hero-text-card {
    width: 100%;
    max-width: 460px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 26px;
  }
  .hvt-quote {
    font-family: var(--font-heading), sans-serif;
    font-weight: 700;
    color: var(--accent);
    font-size: 20px;
  }
  .hvt-name {
    font-family: var(--font-heading), sans-serif;
    font-weight: 800;
    color: var(--accent);
    font-size: 46px;
    letter-spacing: 2px;
  }
  .hvt-subject {
    font-family: var(--font-body), sans-serif;
    font-weight: 500;
    color: var(--text);
    font-size: 20px;
  }
  .hvt-list {
    font-family: var(--font-body), sans-serif;
    font-weight: 500;
    color: var(--text);
    font-size: 17px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: center;
  }
  .hvt-phone {
    font-family: var(--font-heading), sans-serif;
    font-weight: 800;
    color: var(--accent-2);
    font-size: 30px;
    letter-spacing: 3px;
    direction: ltr;
  }
  .hvt-tagline {
    font-family: var(--font-heading), sans-serif;
    font-weight: 700;
    color: var(--accent-2);
    font-size: 24px;
    letter-spacing: 1px;
  }
  @media (max-width: 480px) {
    .hvt-name { font-size: 32px; }
    .hvt-list { font-size: 15px; }
    .hvt-phone { font-size: 22px; }
    .hvt-tagline { font-size: 18px; }
  }
  .login-card-title {
    text-align: center;
    font-family: var(--font-heading), sans-serif;
    font-size: 22px;
    margin: 0 0 16px 0;
  }
  .home-hero-brand { position: relative; z-index: 1; text-align: center; max-width: 400px; margin: 0 auto; }
  .home-hero-graphic-corner {
    position: absolute;
    max-width: 150px;
    max-height: 150px;
    object-fit: contain;
    opacity: 0.92;

  .ai-tutor-wrap {

  /* ---------- Admin dashboard ---------- */
  .dash-wrap {
    min-height: 100vh;
    padding: 26px 30px 50px 30px;
    max-width: 1300px;
    margin: 0 auto;
  }
  .dash-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .dash-title {
    font-family: var(--font-heading), sans-serif;
    font-weight: 800;
    font-size: 24px;
  }
  .dash-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 26px;
  }
  .dash-stat-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: 0 4px 16px -8px rgba(0,0,0,0.4);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  .dash-stat-card:hover {
    box-shadow: 0 10px 26px -8px rgba(0,0,0,0.5);
    transform: translateY(-2px);
  }
  .dash-stat-value {
    font-family: var(--font-heading), sans-serif;
    font-weight: 800;
    font-size: 32px;
    color: var(--accent);
  }
  .dash-stat-label {
    font-size: 15px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .dash-layout {
    display: grid;
    grid-template-columns: 230px 1fr;
    gap: 20px;
    align-items: start;
  }
  .dash-nav {
    position: sticky;
    top: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px;
  }
  .dash-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    border: none;
    color: var(--text);
    text-align: right;
    padding: 11px 12px;
    border-radius: var(--radius);
    font-family: var(--font-body), sans-serif;
    font-size: 15px;
    cursor: pointer;
    width: 100%;
  }
  .dash-nav-item:hover { background: var(--surface-2); }
  .dash-nav-item.active {
    background: var(--accent);
    color: #16283D;
    font-weight: 800;
  }
  .dash-nav-icon { font-size: 18px; flex-shrink: 0; }
  .dash-content { min-width: 0; }
  @media (max-width: 900px) {
    .dash-layout { grid-template-columns: 1fr; }
    .dash-nav {
      position: static;
      flex-direction: row;
      overflow-x: auto;
      gap: 6px;
    }
    .dash-nav-item { white-space: nowrap; width: auto; }
  }

  .dash-body {
    display: grid;
    grid-template-columns: 260px 1fr 1fr;
    gap: 18px;
    align-items: start;
  }
  .dash-body-single { display: block; }
  .dash-detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .dash-detail-grid { grid-template-columns: 1fr; }
  }
  .dash-course-grid {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .dash-course-card {
    position: relative;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .dash-course-card:hover { border-color: rgba(242,179,61,0.5); }
  .dash-course-card-name { font-size: 16px; font-weight: 700; padding-left: 26px; }
  .dash-course-card .channel-delete-btn {
    position: absolute;
    top: 10px;
    left: 10px;
  }
  .dash-panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: 0 4px 16px -8px rgba(0,0,0,0.35);
  }
  .dash-panel h3 {
    font-family: var(--font-heading), sans-serif;
    font-size: 17px;
    margin: 0 0 12px 0;
  }
  .dash-course-list {
    margin-top: 14px;
    max-height: 420px;
    overflow-y: auto;
  }
  .dash-course-item {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    margin-bottom: 4px;
  }
  .dash-course-item:hover { background: var(--surface-2); }
  .dash-course-item.active { background: var(--surface-2); border: 1px solid rgba(242,179,61,0.4); }
  .dash-course-name { font-size: 16px; font-weight: 700; }
  .dash-course-name-input {
    font-size: 16px;
    font-weight: 700;
    background: none;
    border: none;
    border-bottom: 1px dashed transparent;
    color: var(--text);
    font-family: var(--font-body), sans-serif;
    padding: 2px 0;
    width: 100%;
  }
  .dash-course-name-input:hover,
  .dash-course-name-input:focus {
    border-bottom: 1px dashed var(--accent);
    outline: none;
  }
  .dash-course-count { font-size: 14px; color: var(--text-muted); margin-top: 2px; }
  .dash-course-price-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    font-size: 14px;
    color: var(--text-muted);
  }
  .dash-course-price-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 8px;
    color: var(--accent);
    font-family: var(--font-body), sans-serif;
    font-size: 14px;
    font-weight: 700;
  }
  .free-toggle-label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    font-weight: 600;
  }
  .free-toggle-label input[type="checkbox"] {
    width: 15px;
    height: 15px;
    cursor: pointer;
  }
  .dash-course-price-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .dash-lesson-list {
    margin-top: 14px;
    max-height: 420px;
    overflow-y: auto;
  }
  .code-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: var(--radius);
    background: var(--surface-2);
    margin-bottom: 6px;
  }
  .code-value {
    font-family: var(--font-heading), sans-serif;
    font-weight: 700;
    font-size: 15.5px;
    letter-spacing: 1px;
    flex: 1;
  }
  .code-badge {
    font-size: 12.5px;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 700;
  }
  .code-badge.unused { background: rgba(242,179,61,0.18); color: var(--accent); }
  .code-badge.used { background: rgba(169,194,217,0.15); color: var(--text-muted); }

  .student-table {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
  }
  .student-row {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr 1.3fr 1.2fr 1.3fr 0.9fr 0.5fr;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius);
    font-size: 14px;
    align-items: center;
  }
  .student-row-subjects { display: flex; flex-wrap: wrap; gap: 4px; }
  .student-subject-chip {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 12px;
    white-space: nowrap;
  }
  .student-login-info { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .add-student-form {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-end;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 18px;
  }
  .add-student-form .settings-field { flex: 1; min-width: 160px; margin: 0; }
  .student-row:not(.student-row-head):nth-child(odd) {
    background: var(--surface-2);
  }
  .student-row-head {
    font-family: var(--font-heading), sans-serif;
    font-weight: 700;
    color: var(--text-muted);
    font-size: 14px;
  }

  .settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 12px;
  }
  .settings-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .settings-field label {
    font-size: 14.5px;
    color: var(--text-muted);
    font-weight: 700;
  }
  .settings-note {
    margin-top: 16px;
    font-size: 14px;
    color: var(--text-muted);
    background: var(--surface-2);
    border-radius: var(--radius);
    padding: 10px 12px;
  }
  .color-input {
    width: 100%;
    height: 40px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: none;
    cursor: pointer;
    padding: 3px;
  }

  .category-select {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0 10px;
    font-family: var(--font-body), sans-serif;
    font-size: 15px;
    height: 38px;
  }
  .category-group {
    margin-bottom: 18px;
  }
  .category-group:last-child {
    margin-bottom: 0;
  }
  .category-heading {
    font-family: var(--font-heading), sans-serif;
    font-weight: 700;
    font-size: 15.5px;
    color: var(--accent);
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
    margin-bottom: 8px;
  }

  .duration-edit-input {
    margin-top: 3px;
    width: 90px;
    font-size: 14.5px;
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 6px;
    font-family: var(--font-body), sans-serif;
  }
  .duration-edit-input:focus {
    outline: none;
    border-color: var(--accent);
    color: var(--text);
  }

  .materials-box {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: var(--radius);
    background: rgba(242, 179, 61, 0.06);
    border: 1px dashed rgba(242, 179, 61, 0.3);
  }
  .materials-box-head {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;

    align-items: center;
    gap: 8px;
    padding: 6px 4px;
    font-size: 15px;
  }

    color: var(--text);

    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

  .upload-pdf-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    padding: 7px 12px;
    border-radius: var(--radius);
    background: var(--accent);
    color: #16283D;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;

  .upload-video-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    height: 38px;
    border-radius: var(--radius);
    background: var(--surface-2);
    border: 1px dashed var(--accent);
    color: var(--text-muted);
    font-size: 14.5px;
    cursor: pointer;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .upload-video-btn:hover { color: var(--text); }

    .hero-content { max-width: 100%; margin: 0 auto; }
    .hero-brandline { margin-inline: auto; }
    .hero-section .hero-tagline { text-align: center; }
  }

    .settings-grid { grid-template-columns: 1fr; }
  }

  }
  @media (max-width: 820px) {

    .split-card { flex-direction: column; }
    .split-illustration { padding: 20px; min-width: 0; }
    .split-illustration .blob-illustration { max-width: 180px; }
    .sidebar { max-height: 220px; }
  }

  /* ---------- Admin panel ---------- */
  .admin-panel {
    border-top: 1px dashed rgba(242,179,61,0.4);
    margin-top: 18px;
    padding-top: 18px;
    max-width: 560px;
  }
  .admin-panel h4 {
    font-family: var(--font-heading), sans-serif;
    font-size: 16px;
    margin: 0 0 10px 0;
    color: var(--accent);
  }
  .inline-form { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .inline-form input {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 9px 11px;
    color: var(--text);
    font-family: var(--font-body), sans-serif;
    font-size: 15.5px;
  }
  .small-add-btn {
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: var(--radius);
    padding: 9px 14px;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .small-add-btn:hover { border-color: var(--accent); }
  .ghost-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-muted);
    border-radius: var(--radius);
    padding: 9px 14px;
    font-size: 15px;
    cursor: pointer;
  }
  .ghost-btn:hover { color: var(--text); border-color: var(--accent); }

  /* ---------- Certificate ---------- */
  .certificate-modal-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 620px;
  }
  .certificate-card {
    background: #FFF9EC;
    color: #2B2115;
    width: 100%;
    border: 10px solid #C9A24B;
    border-radius: 14px;
    padding: 46px 36px;
    text-align: center;
    box-shadow: 0 20px 50px -12px rgba(0,0,0,0.5);
  }
  .certificate-icon { font-size: 44px; margin-bottom: 6px; }
  .certificate-brand {
    font-family: var(--font-heading), sans-serif;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 1px;
    color: #8A6A1F;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .certificate-title {
    font-family: var(--font-heading), sans-serif;
    font-weight: 800;
    font-size: 30px;
    margin-bottom: 20px;
    color: #2B2115;
  }
  .certificate-text { font-size: 16px; color: #5A4A30; margin: 6px 0; }
  .certificate-name {
    font-family: var(--font-heading), sans-serif;
    font-weight: 800;
    font-size: 26px;
    color: #8A6A1F;
    margin: 10px 0;
  }
  .certificate-course {
    font-weight: 700;
    font-size: 19px;
    margin: 8px 0 10px 0;
    color: #2B2115;
  }
  .certificate-date { font-size: 14px; color: #7A6A50; margin-top: 18px; }
  .certificate-actions { display: flex; gap: 10px; }

  @media print {
    body * { visibility: hidden; }
    .certificate-card, .certificate-card * { visibility: visible; }
    .certificate-card {
      position: fixed;
      inset: 0;
      margin: auto;
      box-shadow: none;
    }
  }

  /* ---------- Modals ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15,20,17,0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .player-card, .devices-card {
    background: var(--surface);
    border-radius: var(--radius);
    width: 100%;
    max-width: 520px;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .player-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
  }
  .player-title { font-family: var(--font-heading), sans-serif; font-weight: 700; font-size: 18.5px; }
  .player-sub { font-size: 14.5px; color: var(--text-muted); margin-top: 3px; }
  .player-screen {
    position: relative;
    background: linear-gradient(135deg, #101F30, #1B3049);
    height: 260px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .real-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  .play-toggle {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(243,247,251,0.14);
    border: 1.5px solid rgba(243,247,251,0.4);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
    font-size: 30px;
  }
  .progress-track {
    height: 4px;
    background: rgba(243,247,251,0.14);
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.2s linear;
  }
  .player-footer { padding: 14px 20px; }
  .lock-note {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14.5px;
    color: var(--text-muted);
  }

  .devices-list { padding: 10px 16px; }
  .device-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 6px;
    border-bottom: 1px solid var(--line);
  }
  .device-row:last-child { border-bottom: none; }
  .device-info { display: flex; align-items: center; gap: 10px; }
  .device-name { font-size: 16px; font-weight: 600; }
  .device-meta { font-size: 14px; color: var(--text-muted); }
  .text-btn {
    background: none;
    border: none;
    font-size: 14.5px;
    cursor: pointer;
    color: var(--text-muted);
    text-decoration: underline;
  }
  .text-btn.danger { color: var(--accent-2); }
  .blocked-banner {
    margin: 0 16px 16px 16px;
    background: rgba(229,83,61,0.16);
    border: 1px solid rgba(229,83,61,0.4);
    color: var(--text);
    padding: 10px 12px;
    border-radius: var(--radius);
    font-size: 14.5px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .delete-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px;
    font-size: 17px;
  }
  .delete-btn:hover { color: var(--accent-2); }

  .loading-note {
    color: #A9C2D9;
    font-family: var(--font-body), sans-serif;
    text-align: center;
    padding: 40px;
  }
</style>

// كل قسم ليه id و parent_id (فاضي يعني قسم رئيسي).
const LESSON_CATEGORIES = ["دوري أول", "دوري ثاني", "فاينل"]; // تُستخدم كقيمة افتراضية بس

// بيحوّل شجرة الأقسام لقائمة مسطّحة (بترتيب العرض) مع "عمق" كل قسم،
// عشان نقدر نعرضها في <select> بمسافات بادئة (— — القسم الفرعي)
function flattenCategories(categories, parentId = null, depth = 0) {
  const level = (categories || [])
    .filter((c) => (c.parent_id || null) === parentId)
    .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  let result = [];
  level.forEach((c) => {
    result.push({ ...c, depth });
    result = result.concat(flattenCategories(categories, c.id, depth + 1));
  });
  return result;
}

function CategoryNode({ node, categories, lessons, depth, isAdmin, handlers }) {
  const children = (categories || [])
    .filter((c) => (c.parent_id || null) === node.id)
    .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  const nodeLessons = (lessons || [])
    .filter((l) => l.category_id === node.id)
    .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

  return (
    <div id={`cat-${node.id}`} className="category-group" style={{ marginInlineStart: depth * 18 }}>
      <div className="category-heading" style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <span>{node.name}</span>
        {isAdmin && (
          <span style={{ display: "flex", gap: 4 }}>
            <button className="icon-btn" title="إعادة تسمية" onClick={() => handlers.onRename(node)}>✏️</button>
            <button className="icon-btn" title="حذف" onClick={() => handlers.onDelete(node)}>🗑️</button>
            <button className="icon-btn" title="إضافة قسم فرعي" onClick={() => handlers.onAddChild(node)}>➕ قسم فرعي</button>
          </span>
        )}
      </div>

      {nodeLessons.length === 0 && children.length === 0 && (
        <div className="empty-state" style={{ padding: "8px 4px" }}>لسه مفيش دروس في القسم ده.</div>
      )}

      {handlers.renderExtra && handlers.renderExtra(node, depth)}

      {nodeLessons.map((l) => handlers.renderLesson(l))}

      {children.map((child) => (
        <CategoryNode
          key={child.id}
          node={child}
          categories={categories}
          lessons={lessons}
          depth={depth + 1}
          isAdmin={isAdmin}
          handlers={handlers}
        />
      ))}
    </div>
  );
}

// إدخال مدة الدرس: بيحتفظ بقيمة محلية وقت الكتابة، وفيه زرار "حفظ" واضح
// بدل ما يعتمد بس على onBlur (اللي ممكن ميتصرفش صح على بعض المتصفحات/الموبايل).
// بيظهر "✔ اتحفظت" لمدة ثانيتين بعد الحفظ الناجح عشان يبقى فيه تأكيد واضح.
function LessonDurationInput({ lesson, onSave }) {
  const [value, setValue] = useState(lesson.duration || "");
  const [justSaved, setJustSaved] = useState(false);
  useEffect(() => {
    setValue(lesson.duration || "");
  }, [lesson.duration]);

  function commit() {
    const trimmed = value.trim();
    if (!trimmed || trimmed === lesson.duration) return;
    onSave(trimmed);
    setJustSaved(true);
    setTimeout(() => setJustSaved(false), 2000);
  }

  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
      <input
        className="duration-edit-input"
        value={value}
        placeholder="مدة الفيديو مثال 12:30"
        onChange={(e) => setValue(e.target.value)}
        onBlur={commit}
        onKeyDown={(e) => {
          if (e.key === "Enter") { e.preventDefault(); commit(); }
        }}
      />
      <button type="button" className="icon-btn" title="حفظ المدة" onClick={commit}>💾</button>
      {justSaved && <span style={{ color: "#3CB371", fontSize: 12 }}>✔ اتحفظت</span>}
    </div>
  );
}

// إدخال سعر المادة (أو السعر قبل الخصم): بيحتفظ بقيمة محلية وقت الكتابة،
// وفيه زرار "حفظ" واضح بدل الاعتماد بس على onBlur. لما يتحفظ، بينتظر
// تأكيد فعلي إن قاعدة البيانات قبلت التعديل قبل ما يظهر "✔ اتحفظ" — عشان
// الأدمن يبقى متأكد إن السعر فعلاً محفوظ مش مجرد شكل في الشاشة.
function ChannelPriceFieldInput({ value, placeholder, onSave }) {
  const [text, setText] = useState(value || "");
  const [status, setStatus] = useState("idle"); // idle | saving | saved | error
  useEffect(() => {
    setText(value || "");
  }, [value]);

  async function commit() {
    const trimmed = text.trim();
    if (trimmed === (value || "")) return;
    setStatus("saving");
    const result = await onSave(trimmed);
    if (result && result.ok === false) {
      setStatus("error");
      setTimeout(() => setStatus("idle"), 3000);
    } else {
      setStatus("saved");
      setTimeout(() => setStatus("idle"), 2000);
    }
  }

  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6, flex: 1 }}>
      <input
        className="dash-course-price-input"
        value={text}
        placeholder={placeholder}
        onChange={(e) => setText(e.target.value)}
        onBlur={commit}
        onKeyDown={(e) => {
          if (e.key === "Enter") { e.preventDefault(); commit(); }
        }}
      />
      <button type="button" className="icon-btn" title="حفظ" onClick={commit}>💾</button>
      {status === "saving" && <span style={{ color: "var(--text-muted)", fontSize: 12, whiteSpace: "nowrap" }}>...بيتحفظ</span>}
      {status === "saved" && <span style={{ color: "#3CB371", fontSize: 12, whiteSpace: "nowrap" }}>✔ اتحفظ</span>}
      {status === "error" && <span style={{ color: "#e05555", fontSize: 12, whiteSpace: "nowrap" }}>✗ فشل الحفظ</span>}
    </div>
  );
}

function Watermark({ text }) {
  const [pos, setPos] = useState({ top: "20%", left: "15%" });
  useEffect(() => {
    const id = setInterval(() => {
      setPos({
        top: `${10 + Math.random() * 60}%`,
        left: `${8 + Math.random() * 60}%`,
      });
    }, 2600);
    return () => clearInterval(id);
  }, []);
  return (
    <div
      style={{
        position: "absolute",
        top: pos.top,
        left: pos.left,
        color: "rgba(243,247,251,0.28)",
        fontFamily: "Cairo, sans-serif",
        fontWeight: 700,
        fontSize: 13,
        transition: "top 1.5s ease, left 1.5s ease",
        pointerEvents: "none",
        whiteSpace: "nowrap",
        userSelect: "none",
      }}
    >
      {text}
    </div>

function VideoPlayerModal({ lesson, student, onClose, onSecurityEvent }) {
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(0);
  const timerRef = useRef(null);
  const videoRef = useRef(null);
  const devtoolsFlagged = useRef(false);
  const hasRealVideo = !!lesson.videoUrl;

  useEffect(() => {
    if (hasRealVideo) return;
    if (playing) {
      timerRef.current = setInterval(() => {
        setProgress((p) => (p >= 100 ? 100 : p + 0.6));
      }, 200);
    } else {
      clearInterval(timerRef.current);
    }
    return () => clearInterval(timerRef.current);
  }, [playing, hasRealVideo]);

  // مراقبة محاولات التلاعب وقت مشاهدة الفيديو: تحميل (Ctrl+S)، فتح أدوات
  // المطور (F12 / Ctrl+Shift+I)، أو لقطة شاشة (PrintScreen). كل واحدة
  // بتتسجل مرة واحدة بس في الجلسة دي عشان محدش يمتلي سجل الأمان بتكرار.
  useEffect(() => {
    function handleKeyDown(e) {
      const key = (e.key || "").toLowerCase();
      if ((e.ctrlKey || e.metaKey) && key === "s") {
        e.preventDefault();
        onSecurityEvent && onSecurityEvent("download_attempt", `الدرس: ${lesson.title} (Ctrl+S)`);
      } else if (
        key === "f12" ||
        ((e.ctrlKey || e.metaKey) && e.shiftKey && ["i", "j", "c"].includes(key))
      ) {
        if (!devtoolsFlagged.current) {
          devtoolsFlagged.current = true;
          onSecurityEvent && onSecurityEvent("devtools_attempt", `الدرس: ${lesson.title} (اختصار فتح أدوات المطور)`);
        }
      } else if (key === "printscreen") {
        onSecurityEvent && onSecurityEvent("screenshot_attempt", `الدرس: ${lesson.title} (PrintScreen)`);
      }
    }
    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, [lesson.title, onSecurityEvent]);

  function togglePlay() {
    if (hasRealVideo && videoRef.current) {
      if (playing) {
        videoRef.current.pause();
      } else {
        videoRef.current.play();
      }
    }
    setPlaying((p) => !p);
  }

  function handleTimeUpdate() {
    const v = videoRef.current;
    if (v && v.duration) setProgress((v.currentTime / v.duration) * 100);
  }

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div
        className="player-card"
        onClick={(e) => e.stopPropagation()}
        onContextMenu={(e) => {
          e.preventDefault();
          onSecurityEvent && onSecurityEvent("right_click_video", `الدرس: ${lesson.title}`);
        }}
      >
        <div className="player-header">
          <div>
            <div className="player-title">{lesson.title}</div>
            <div className="player-sub">{lesson.duration}</div>
          </div>
          <button className="icon-btn" onClick={onClose} aria-label="إغلاق">✕</button>
        </div>

        <div className="player-screen">
          {hasRealVideo && lesson.isEmbed ? (
            <iframe
              src={lesson.videoUrl}
              style={{ width: "100%", height: "100%", border: 0, position: "absolute", inset: 0 }}
              allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
              allowFullScreen
            />
          ) : (
            hasRealVideo && (
              <video
                ref={videoRef}
                className="real-video"
                src={lesson.videoUrl}
                onTimeUpdate={handleTimeUpdate}
                onEnded={() => setPlaying(false)}
                controlsList="nodownload noremoteplayback"
                disablePictureInPicture
                playsInline
              />
            )
          )}
          <Watermark text={`${student.name} · ${student.phone}`} />
          <Watermark text={`${student.name} · ${student.phone}`} />
          {!lesson.isEmbed && (
            <button className="play-toggle" onClick={togglePlay}>
              {playing ? "⏸" : "▶"}
            </button>
          )}
        </div>

        {!lesson.isEmbed && (
          <div className="progress-track">
            <div className="progress-fill" style={{ width: `${progress}%` }} />
          </div>
        )}

        <div className="player-footer">
          <div className="lock-note">
            <span>🔒</span>
            <span>البث محمي، والتحميل غير متاح على هذا الحساب</span>
          </div>
        </div>
      </div>
    </div>
  );
}

    if (pendingChannelId) setSelectedChannelId(pendingChannelId);
    const code = String(Math.floor(1000 + Math.random() * 9000));
    setOtpCode(code);

  async function handleVerifyOtp(e) {
    e.preventDefault();
    if (otpInput.trim() !== otpCode) {
      setOtpError("الكود غلط، جرب تاني.");
      return;
    }
    setOtpError("");
    setAuthBusy(true);

    // تسجيل حقيقي في Supabase (بدل التخزين المؤقت في الذاكرة)
    const passwordVal = passwordFromPhone(student.phone);
    const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
      email: student.email.trim(),
      password: passwordVal,
    });

    if (signUpError && !signUpError.message.includes("already registered")) {
      setOtpError("حصل خطأ في التسجيل: " + signUpError.message);
      setAuthBusy(false);
      return;
    }

    let userId = signUpData?.user?.id;
    let activeSession = signUpData?.session;

    // لو الإيميل ده مسجل قبل كده أصلاً (رسالة "already registered")، مفيش
    // user/session راجعين من signUp، فبنعمل تسجيل دخول عادي بدلها عشان
    // نلحق نصلح صف الطالب في القاعدة لو كان ضايع من قبل.
    if (!userId) {
      const { data: signInData, error: signInErr } = await supabaseClient.auth.signInWithPassword({
        email: student.email.trim(),
        password: passwordVal,
      });
      if (signInErr) {
        setOtpError(
          signInErr.message.toLowerCase().includes("confirm")
            ? "الحساب ده لسه محتاج تأكيد إيميل من Supabase (خاصية Confirm email شغالة). كلّم أ. " + settings.teacherName + " يوقفها من Supabase: Authentication ← Providers ← Email."
            : "حصل خطأ في تسجيل الدخول: " + signInErr.message
        );
        setAuthBusy(false);
        return;
      }
      userId = signInData?.user?.id;
      activeSession = signInData?.session;
    }

    if (userId) {
      // لو مفيش جلسة دخول فعلية بعد التسجيل (ده بيحصل لو خاصية "Confirm
      // email" شغالة في إعدادات Supabase Auth)، بنحاول نسجل دخول فورًا
      // بنفس الباسورد عشان نضمن إن auth.uid() يبقى موجود وقت إضافة صف
      // الطالب — وإلا الإضافة هتترفض بصمت بسبب صلاحيات RLS ومش هيظهر
      // الطالب خالص عند الأدمن حتى لو التسجيل شكله نجح قدام الطالب.
      if (!activeSession) {
        const { error: fallbackSignInErr } = await supabaseClient.auth.signInWithPassword({
          email: student.email.trim(),
          password: passwordVal,
        });
        if (fallbackSignInErr) {
          setOtpError(
            fallbackSignInErr.message.toLowerCase().includes("confirm")
              ? "اتسجلت بس الحساب لسه محتاج تأكيد إيميل من Supabase (خاصية Confirm email شغالة). كلّم أ. " + settings.teacherName + " يوقفها من Supabase: Authentication ← Providers ← Email."
              : "اتسجلت بس حصلت مشكلة في تفعيل الجلسة: " + fallbackSignInErr.message
          );
        }
      }
      const { error: insertError } = await supabaseClient.from("students").upsert({
        id: userId,
        name: student.name.trim(),
        phone: student.phone.trim(),
        email: student.email.trim(),
      });
      if (insertError) {
        console.error("تعذر حفظ بيانات الطالب:", insertError.message);
        setOtpError(
          "اتسجلت في نظام الدخول لكن حصلت مشكلة في حفظ بياناتك (" + insertError.message +
          ")، كلّم أ. " + settings.teacherName + " عشان يتأكد من إعدادات Supabase."
        );
      }
      loadStudentProgress(userId);
      logStudentLoginEvent(userId);
      setStudent((s) => ({ ...s, id: userId }));
    }

    setRegisteredStudents((list) => {
      const exists = list.some(
        (s) => s.phone === student.phone && s.email === student.email
      );
      if (exists) return list;
      return [
        ...list,
        {
          id: userId || "st" + Date.now(),
          name: student.name,
          phone: student.phone,
          email: student.email,
          username: student.username,
          registeredAt: new Date().toLocaleDateString("ar-EG"),
        },
      ];
    });
    setAuthBusy(false);
    setStage("app");
  }

  async function handleReturningLogin(e) {
    e.preventDefault();
    if (!returningLogin.name.trim() || !returningLogin.phone.trim() || !returningLogin.email.trim()) return;
    setReturningLoginError("");
    setAuthBusy(true);

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: returningLogin.email.trim(),
      password: passwordFromPhone(returningLogin.phone),
    });

    setAuthBusy(false);

    if (error) {
      if (error.message && error.message.toLowerCase().includes("confirm")) {
        setReturningLoginError(
          "الحساب ده لسه محتاج تأكيد إيميل من Supabase (خاصية Confirm email شغالة). " +
          "لازم أ. " + settings.teacherName + " يوقفها من Supabase: Authentication ← Providers ← Email ← يطفي Confirm email."
        );
      } else {
        setReturningLoginError("البيانات دي مش متسجلة قبل كده، أو غلط. سجل كطالب جديد الأول.");
      }
      return;
    }

    setStudent({
      id: data?.user?.id,
      name: returningLogin.name.trim(),
      phone: returningLogin.phone.trim(),
      email: returningLogin.email.trim(),
      username: "",
    });

    // نجيب المواد اللي الطالب ده فاتحها فعلاً قبل كده — من غير الخطوة دي
    // كانت كل المواد بتظهر "محتاجة كود" حتى لو الطالب سبق وفتحها.
    const userId = data?.user?.id;
    if (userId) {
      // "علاج ذاتي": لو الطالب ده كان سجل قبل ما نصلّح مشكلة حفظ بيانات
      // التسجيل (وبالتالي صفه في جدول students ضاع)، بنعيد إنشاءه هنا تاني
      // كل مرة يدخل، عشان يفضل ظاهر عند الأدمن من غير أي تدخل يدوي في القاعدة.
      const { error: upsertError } = await supabaseClient.from("students").upsert({
        id: userId,
        name: returningLogin.name.trim(),
        phone: returningLogin.phone.trim(),
        email: returningLogin.email.trim(),
      });
      if (upsertError) console.error("تعذر تحديث بيانات الطالب:", upsertError.message);

      const { data: enrolledRows } = await supabaseClient
        .from("enrollments")
        .select("channel_id")
        .eq("student_id", userId);
      if (enrolledRows?.length) {
        setUnlockedChannelIds(enrolledRows.map((r) => r.channel_id));
      }
      loadStudentProgress(userId);
      logStudentLoginEvent(userId);
    }

    if (pendingChannelId) setSelectedChannelId(pendingChannelId);
    setStage("app");
  }

  // دخول الأدمن الحقيقي: تسجيل دخول فعلي في Supabase Auth، وبعدين التأكد
  // إن الحساب ده فعلاً مضاف في جدول "admins" (وإلا بيترفض حتى لو الباسورد صح).
  async function handleAdminLogin(e) {
    e.preventDefault();
    setAdminLoginError("");
    setAdminLoginBusy(true);
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: adminLoginEmail.trim(),
      password: adminLoginPassword,
    });
    if (error || !data?.user) {
      setAdminLoginError("البريد الإلكتروني أو كلمة المرور غلط.");
      setAdminLoginBusy(false);
      return;
    }
    const { data: adminRow } = await supabaseClient
      .from("admins")
      .select("id")
      .eq("id", data.user.id)
      .maybeSingle();
    if (!adminRow) {
      setAdminLoginError("الحساب ده مسجل دخول لكنه مش مضاف كأدمن على المنصة.");
      await supabaseClient.auth.signOut();
      setAdminLoginBusy(false);
      return;
    }
    setRole("admin");
    setStudent({ name: "الأدمن", phone: "—", email: data.user.email || "—", username: "—" });
    setStage("app");
    setAdminLoginBusy(false);
    loadAllStudents();
  }

  // بيانات الطلاب حساسة (إيميل ورقم هاتف)، فمينفعش نجيبها مباشرة من الجدول
  // بمفتاح anon عادي (قاعدة الحماية RLS بتمنع أي حد يشوف غير بياناته هو بس).
  // عشان كده بنعدي عن طريق Edge Function بتتحقق إن اللي طالب البيانات فعلاً
  // أدمن مسجل في جدول admins قبل ما ترجع أي حاجة.
  async function callAdminStudentsFunction(payload) {
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const token = sessionData?.session?.access_token;
    if (!token) throw new Error("لازم تكون مسجل دخول كأدمن.");
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-students`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`,
        apikey: SUPABASE_ANON_KEY,
      },
      body: JSON.stringify(payload),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json?.error || "حصل خطأ غير متوقع.");
    return json;
  }

  async function loadAllStudents() {
    setStudentsLoading(true);
    setStudentsError("");
    try {
      const json = await callAdminStudentsFunction({ action: "list" });
      setRegisteredStudents(json.students || []);
    } catch (e) {
      setStudentsError(
        "تعذر تحميل بيانات الطلاب: " + e.message +
        "\n(تأكد إنك شغّلت كود إعداد جدول الأدمن وسحابة الدالة admin-students في Supabase)"
      );
    } finally {
      setStudentsLoading(false);
    }
    loadStudentActivity();
  }

  // بيانات مراقبة الأمان: المواد اللي كل طالب داخلها، آخر دخول ليه (IP/دولة
  // /جهاز)، وأي نشاط مشبوه (محاولات تحميل، فتح أدوات مطور، يمين ماوس على
  // الفيديو...). كل الجداول دي عندها صلاحية قراءة كاملة للأدمن الحقيقي بس.
  async function loadStudentActivity() {
    const [{ data: enrollRows }, { data: loginRows }, { data: secRows }] = await Promise.all([
      supabaseClient.from("enrollments").select("student_id, channel_id"),
      supabaseClient.from("login_events").select("student_id, ip, country, city, user_agent, created_at").order("created_at", { ascending: false }),
      supabaseClient.from("security_events").select("student_id, channel_id, event_type, details, created_at").order("created_at", { ascending: false }).limit(200),
    ]);

    const byStudentEnroll = {};
    (enrollRows || []).forEach((r) => {
      if (!byStudentEnroll[r.student_id]) byStudentEnroll[r.student_id] = [];
      byStudentEnroll[r.student_id].push(r.channel_id);
    });
    setEnrollmentsByStudent(byStudentEnroll);

    const lastLogin = {};
    (loginRows || []).forEach((r) => {
      if (!lastLogin[r.student_id]) lastLogin[r.student_id] = r; // أول ظهور = الأحدث (مرتبين تنازليًا)
    });
    setLastLoginByStudent(lastLogin);

    setSecurityEvents(secRows || []);
  }

  // كل تعديل في اسم/سعر/مجانية المادة بيتبعت فورًا لجدول public.channels في
  // قاعدة البيانات، عشان يفضل محفوظ دايمًا ويظهر بنفس الشكل على أي جهاز أو
  // متصفح تاني (مش مجرد تعديل مؤقت في ذاكرة المتصفح بيتمسح مع أي Refresh).
  // بترجع Promise عشان أي حقل (زي السعر) يقدر يوريك تأكيد "اتحفظت" فعلي
  // بعد ما نتأكد إن قاعدة البيانات فعلاً قبلت التعديل، مش مجرد افتراض.
  async function saveChannelToDb(channelId, fields) {
    const { error } = await supabaseClient.from("channels").update(fields).eq("id", channelId);
    if (error) {
      console.error("تعذر حفظ بيانات المادة:", error.message);
      return { ok: false, error: error.message };
    }
    return { ok: true };
  }

  function extractEmbedUrl(input) {
    const trimmed = input.trim();
    // لو اللي اتلصق كود iframe كامل، نستخرج بس اللي جوه src="..."
    const match = trimmed.match(/src=["']([^"']+)["']/i);
    return match ? match[1] : trimmed;
  }

  // رفع فيديو من جهاز الأدمن مباشرة لمكتبة Bunny (من غير ما يدخل موقع Bunny
  // خالص) عن طريق Edge Function اسمها bunny-create-upload بتجهز التصريح،
  // وبعدين بنرفع الملف فعليًا لـ Bunny باستخدام بروتوكول TUS.
  async function uploadVideoDirectToBunny(file) {
    if (!selectedChannel) {
      alert("اختار المادة الأول من القائمة.");
      return;
    }
    if (!newLesson.title.trim()) {
      alert("لازم تكتب عنوان للدرس قبل ما ترفع الفيديو.");
      return;
    }
    if (typeof tus === "undefined") {
      alert("مكتبة الرفع (tus) مش شغالة — تأكد إنك متصل بالإنترنت وجرب تاني.");
      return;
    }
    setUploadingVideo(true);
    setUploadProgress(0);
    try {
      const { data, error } = await supabaseClient.functions.invoke("bunny-create-upload", {
        body: { title: newLesson.title.trim() },
      });
      if (error || !data || data.error) {
        alert("حصل خطأ في تجهيز الرفع: " + (data?.error || error?.message || "خطأ غير معروف"));
        setUploadingVideo(false);
        setUploadProgress(null);
        return;
      }
      const { libraryId, videoId, authorizationSignature, authorizationExpire } = data;
      const upload = new tus.Upload(file, {
        endpoint: "https://video.bunnycdn.com/tusupload",
        retryDelays: [0, 3000, 5000, 10000, 20000],
        headers: {
          AuthorizationSignature: authorizationSignature,
          AuthorizationExpire: String(authorizationExpire),
          VideoId: videoId,
          LibraryId: String(libraryId),
        },
        metadata: {
          filetype: file.type || "video/mp4",
          title: newLesson.title.trim(),
        },
        onError: (err) => {
          alert("فشل رفع الفيديو لـ Bunny: " + err.message);
          setUploadingVideo(false);
          setUploadProgress(null);
        },
        onProgress: (bytesUploaded, bytesTotal) => {
          setUploadProgress(Math.round((bytesUploaded / bytesTotal) * 100));
        },
        onSuccess: () => {
          const embedUrl = `https://iframe.mediadelivery.net/embed/${libraryId}/${videoId}`;
          setNewLesson((n) => ({ ...n, bunnyEmbedUrl: embedUrl }));
          setUploadingVideo(false);
          setUploadProgress(null);
          alert("تم رفع الفيديو بنجاح! دلوقتي دوس «🎥 إضافة الدرس» عشان يتسجل في القائمة.");
        },
      });
      upload.start();
    } catch (e) {
      alert("حصل خطأ غير متوقع أثناء الرفع: " + e.message);
      setUploadingVideo(false);
      setUploadProgress(null);
    }
  }

  async function addLesson() {
    if (!selectedChannel) return;
    if (!newLesson.title.trim()) {
      alert("لازم تكتب عنوان للدرس الأول.");
      return;
    }
    // الأولوية لرابط Bunny (فيديو حقيقي مشفّر ومستضاف)، ولو مش موجود
    // نستخدم الملف المحلي (للتجربة بس، الفيديو ده مش هيفضل شغال بعد إغلاق المتصفح)
    const rawBunny = newLesson.bunnyEmbedUrl?.trim();
    if (newLesson.videoFile && !rawBunny) {
      alert("رفع فيديو من جهازك للتجربة بس ومش بيتحفظ بعد الـ Refresh. استخدم رابط Bunny عشان يفضل محفوظ.");
    }
    const videoUrl = rawBunny
      ? extractEmbedUrl(rawBunny)
      : newLesson.videoFile
      ? URL.createObjectURL(newLesson.videoFile)
      : null;
    const isEmbed = !!rawBunny;
    const title = newLesson.title.trim();
    const duration = newLesson.duration.trim() || "--:--";
    const categoryId = newLesson.categoryId || (selectedChannel.categories || [])[0]?.id || null;
    if (!categoryId) {
      alert("لازم يكون فيه قسم واحد على الأقل (زي دوري أول) قبل ما تضيف درس. أضف قسم الأول.");
      return;
    }

    const siblingLessons = (selectedChannel.lessons || []).filter((l) => l.category_id === categoryId);
    const nextSortOrder = siblingLessons.length
      ? Math.max(...siblingLessons.map((l) => l.sort_order || 0)) + 1
      : 1;

    // نحفظ الدرس في قاعدة البيانات عشان يفضل موجود بعد أي Refresh
    const { data: inserted, error } = await supabaseClient
      .from("lessons")
      .insert({
        channel_id: selectedChannelId,
        title,
        duration,
        category_id: categoryId,
        video_url: videoUrl,
        is_embed: isEmbed,
        sort_order: nextSortOrder,
      })
      .select()
      .single();

    if (error) {
      alert("حصل خطأ في حفظ الدرس: " + error.message);
      return;
    }

    setChannels((cs) =>
      cs.map((c) =>
        c.id === selectedChannelId
          ? {
              ...c,
              lessons: [
                ...c.lessons,
                {
                  id: inserted.id,
                  title,
                  duration,
                  category_id: categoryId,
                  videoUrl,
                  isEmbed,
                  sort_order: nextSortOrder,
                },
              ],
            }
          : c
      )
    );
    setNewLesson({ title: "", duration: "", categoryId, videoFile: null, bunnyEmbedUrl: "" });
    pushNotification(`درس جديد: ${title}`, `اتضاف في مادة ${selectedChannel.name}`, selectedChannelId);
  }

  async function addCategory(channelId, parentId, name) {
    const trimmed = (name || "").trim();
    if (!trimmed) return;
    // ترتيب القسم الجديد = أكبر ترتيب موجود بين إخوته + 1 (بدل استخدام
    // Date.now() اللي كان بيطلع رقم أكبر من حد عمود integer في قاعدة البيانات)
    const channel = channels.find((c) => c.id === channelId);
    const siblings = (channel?.categories || []).filter(
      (c) => (c.parent_id || null) === (parentId || null)
    );
    const nextOrder = siblings.length
      ? Math.max(...siblings.map((c) => c.sort_order || 0)) + 1
      : 1;
    const { data: inserted, error } = await supabaseClient
      .from("categories")
      .insert({ channel_id: channelId, parent_id: parentId || null, name: trimmed, sort_order: nextOrder })
      .select()
      .single();
    if (error) {
      alert("حصل خطأ في إضافة القسم: " + error.message);
      return;
    }
    setChannels((cs) =>
      cs.map((c) => (c.id === channelId ? { ...c, categories: [...(c.categories || []), inserted] } : c))
    );
  }

  async function renameCategory(category) {
    const newName = prompt("الاسم الجديد للقسم:", category.name);
    if (!newName || !newName.trim() || newName.trim() === category.name) return;
    const trimmed = newName.trim();
    await supabaseClient.from("categories").update({ name: trimmed }).eq("id", category.id);
    setChannels((cs) =>
      cs.map((c) => ({
        ...c,
        categories: (c.categories || []).map((cat) => (cat.id === category.id ? { ...cat, name: trimmed } : cat)),
      }))
    );
  }

  async function deleteCategory(category) {
    const ok = confirm(
      `متأكد إنك عايز تمسح "${category.name}"؟ هيتمسح معاه أي أقسام فرعية وأي دروس جواه، ومينفعش ترجعه.`
    );
    if (!ok) return;
    await supabaseClient.from("categories").delete().eq("id", category.id);
    // نعيد تحميل الدروس والأقسام لأن الحذف كان Cascade في قاعدة البيانات
    // (ممكن يكون مسح أقسام فرعية ودروس مش شايفينها هنا محليًا)
    const [{ data: lessonRows }, { data: categoryRows }] = await Promise.all([
      supabaseClient.from("lessons").select("*").order("sort_order", { ascending: true }),
      supabaseClient.from("categories").select("*").order("sort_order", { ascending: true }),
    ]);
    setChannels((cs) =>
      cs.map((c) => ({
        ...c,
        categories: (categoryRows || []).filter((cat) => cat.channel_id === c.id),
        lessons: (lessonRows || [])
          .filter((l) => l.channel_id === c.id)
          .map((l) => ({
            id: l.id,
            title: l.title,
            duration: l.duration || "--:--",
            category_id: l.category_id,
            videoUrl: l.video_url,
            isEmbed: l.is_embed,
            sort_order: l.sort_order || 0,
          })),
      }))
    );
  }

  async function deleteLesson(lessonId) {

  async function updateLessonDuration(lessonId, duration) {
    const { error } = await supabaseClient.from("lessons").update({ duration }).eq("id", lessonId);
    if (error) {

      cs.map((c) =>

  // تبديل ترتيب درسين جنب بعض (لأعلى/لأسفل) جوه نفس القسم — بيبدّل قيمة
  // sort_order بينهم في قاعدة البيانات وفي الحالة المحلية مرة واحدة.
  async function moveLesson(lesson, direction) {
    const siblings = (selectedChannel?.lessons || [])
      .filter((l) => l.category_id === lesson.category_id)
      .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
    const idx = siblings.findIndex((l) => l.id === lesson.id);
    const swapIdx = direction === "up" ? idx - 1 : idx + 1;
    if (idx === -1 || swapIdx < 0 || swapIdx >= siblings.length) return;
    const other = siblings[swapIdx];
    const a = lesson.sort_order || 0;
    const b = other.sort_order || 0;
    const [{ error: err1 }, { error: err2 }] = await Promise.all([
      supabaseClient.from("lessons").update({ sort_order: b }).eq("id", lesson.id),
      supabaseClient.from("lessons").update({ sort_order: a }).eq("id", other.id),
    ]);
    if (err1 || err2) {
      alert("حصل خطأ في تبديل ترتيب الفيديوهات: " + (err1?.message || err2?.message));
      return;
    }
    setChannels((cs) =>
      cs.map((c) =>
        c.id === selectedChannelId
          ? {
              ...c,
              lessons: c.lessons.map((l) => {
                if (l.id === lesson.id) return { ...l, sort_order: b };
                if (l.id === other.id) return { ...l, sort_order: a };
                return l;
              }),
            }
          : c
      )
    );
  }

  // رفع ملزمة PDF فعليًا لتخزين Supabase (Storage) وتسجيلها في قاعدة
  // البيانات — قبل كده كانت بتترفع بـ URL.createObjectURL اللي بيشتغل
  // في متصفح الأدمن بس ويختفي فورًا، فمحدش تاني (ولا حتى الطالب) كان
  // يقدر يشوفها.
  async function uploadMaterial(channelId, category, file) {
    if (!file) return;
    // Supabase Storage بترفض أي مفتاح ملف فيه حروف عربية أو مسافات أو
    // رموز غريبة ("Invalid key")، فبنعمل اسم مسار آمن بالإنجليزي بس
    // (أرقام وحروف لاتينية) ونحتفظ بالاسم العربي الأصلي في عمود "name"
    // في قاعدة البيانات عشان يظهر زي ما هو للطالب.
    const extMatch = /\.([a-zA-Z0-9]+)$/.exec(file.name);
    const ext = extMatch ? extMatch[1].toLowerCase() : "pdf";
    const safeName = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const path = `${channelId}/${safeName}`;
    const { error: uploadError } = await supabaseClient.storage
      .from("materials")
      .upload(path, file, { cacheControl: "3600", upsert: false });
    if (uploadError) {
      alert(
        "حصل خطأ في رفع الملزمة: " +
          uploadError.message +
          "\n(تأكد إنك شغّلت كود إعداد تخزين الملازم في Supabase)"
      );
      return;
    }
    const { data: publicUrlData } = supabaseClient.storage.from("materials").getPublicUrl(path);
    const url = publicUrlData?.publicUrl || "";
    const { data: inserted, error: insertError } = await supabaseClient
      .from("materials")
      .insert({ channel_id: channelId, category, name: file.name, url, path })
      .select()
      .single();
    if (insertError) {
      alert("اتحمّل الملف بس حصل خطأ في تسجيله: " + insertError.message);
      return;
    }
    setChannels((cs) =>
      cs.map((c) =>
        c.id === channelId
          ? {
              ...c,
              materials: [
                ...(c.materials || []),
                { id: inserted.id, name: inserted.name, category: inserted.category, url: inserted.url, path: inserted.path },
              ],
            }
          : c
      )
    );
    const channelName = channels.find((c) => c.id === channelId)?.name || "";
    pushNotification(`ملزمة جديدة: ${file.name}`, `اتضافت في مادة ${channelName}`, channelId);
  }

  async function deleteMaterial(channelId, materialId) {
    const channel = channels.find((c) => c.id === channelId);
    const material = (channel?.materials || []).find((m) => m.id === materialId);
    await supabaseClient.from("materials").delete().eq("id", materialId);
    if (material?.path) {
      await supabaseClient.storage.from("materials").remove([material.path]);
    }
    setChannels((cs) =>
      cs.map((c) =>
        c.id === channelId
          ? { ...c, materials: (c.materials || []).filter((m) => m.id !== materialId) }
          : c
      )
    );
  }

  // رفع ملف لبنك الأسئلة (Test Bank) — مش مرتبط بمادة معينة، بيظهر لكل
  // الطلاب في صفحة "Test Bank" في القايمة الجانبية.
  const [uploadingTestBank, setUploadingTestBank] = useState(false);
  async function uploadTestBankFile(file) {
    if (!file) return;
    setUploadingTestBank(true);
    const extMatch = /\.([a-zA-Z0-9]+)$/.exec(file.name);
    const ext = extMatch ? extMatch[1].toLowerCase() : "pdf";
    const safeName = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const path = `test-bank/${safeName}`;
    const { error: uploadError } = await supabaseClient.storage
      .from("materials")
      .upload(path, file, { cacheControl: "3600", upsert: false });
    if (uploadError) {
      setUploadingTestBank(false);
      alert("حصل خطأ في رفع الملف: " + uploadError.message);
      return;
    }
    const { data: publicUrlData } = supabaseClient.storage.from("materials").getPublicUrl(path);
    const url = publicUrlData?.publicUrl || "";
    const { data: inserted, error: insertError } = await supabaseClient
      .from("materials")
      .insert({ channel_id: null, category: "Test Bank", name: file.name, url, path })
      .select()
      .single();
    setUploadingTestBank(false);
    if (insertError) {
      alert("اتحمّل الملف بس حصل خطأ في تسجيله: " + insertError.message);
      return;
    }
    setTestBankFiles((f) => [...f, { id: inserted.id, name: inserted.name, url: inserted.url, path: inserted.path }]);
  }

  async function deleteTestBankFile(materialId) {
    const file = testBankFiles.find((m) => m.id === materialId);
    await supabaseClient.from("materials").delete().eq("id", materialId);
    if (file?.path) {
      await supabaseClient.storage.from("materials").remove([file.path]);
    }
    setTestBankFiles((f) => f.filter((m) => m.id !== materialId));
  }

  // تتبع تقدم الطالب: أي دروس خلّصها عشان نعرض نسبة الإتمام والشهادة
  async function loadStudentProgress(userId) {
    if (!userId) return;
    const { data } = await supabaseClient
      .from("lesson_progress")
      .select("lesson_id")
      .eq("student_id", userId);
    if (data) setCompletedLessonIds(data.map((r) => r.lesson_id));
  }

  // تسجيل كل مرة طالب يدخل بيها المنصة: الـ IP والدولة والمدينة (لو اتعرفوا)
  // ونوع الجهاز/المتصفح — عشان الأدمن يقدر يراقب أي دخول غريب أو مشبوه.
  // بنستخدم خدمة مجانية بترجع بيانات الزائر نفسه بس (ipapi.co)، ولو فشل
  // الطلب لأي سبب (حجب، إنترنت بطيء...) بنتجاهله وما بنوقفش تسجيل الدخول.
  async function logStudentLoginEvent(userId) {
    if (!userId) return;
    let ip = null, country = null, city = null;
    try {
      const res = await fetch("https://ipapi.co/json/");
      if (res.ok) {
        const geo = await res.json();
        ip = geo.ip || null;
        country = geo.country_name || null;
        city = geo.city || null;
      }
    } catch (e) {
      // مفيش إنترنت للخدمة دي أو اتحجبت — نسجل الدخول من غير بيانات الموقع
    }
    await supabaseClient.from("login_events").insert({
      student_id: userId,
      ip,
      country,
      city,
      user_agent: navigator.userAgent,
    });
  }

  // تسجيل أي نشاط مشبوه (يمين ماوس على الفيديو، محاولة تحميل، محاولة فتح
  // أدوات المطور...) عشان الأدمن يشوفه في تبويب "سجل الأمان".
  async function logSecurityEvent(eventType, details, channelId) {
    if (!student.id) return;
    await supabaseClient.from("security_events").insert({
      student_id: student.id,
      channel_id: channelId || null,
      event_type: eventType,
      details: details || null,
    });
  }

  // تعديل اسم الطالب في ملفه الشخصي — بيتحفظ في جدول public.students عشان
  // يفضل ظاهر بنفس الاسم في أي جهاز تاني يسجل بيه دخول بعد كده.
  async function updateStudentName(name) {
    const trimmed = name.trim();
    if (!trimmed || !student.id) return { ok: false, error: "الاسم مطلوب" };
    const { error } = await supabaseClient.from("students").update({ name: trimmed }).eq("id", student.id);
    if (error) return { ok: false, error: error.message };
    setStudent((s) => ({ ...s, name: trimmed }));
    return { ok: true };
  }

  async function toggleLessonComplete(lesson) {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      alert("لازم تكون مسجل دخول عشان تسجل تقدمك في الدروس.");
      return;
    }
    const isDone = completedLessonIds.includes(lesson.id);
    if (isDone) {
      await supabaseClient
        .from("lesson_progress")
        .delete()
        .eq("student_id", user.id)
        .eq("lesson_id", lesson.id);
      setCompletedLessonIds((ids) => ids.filter((id) => id !== lesson.id));
    } else {
      const { error } = await supabaseClient
        .from("lesson_progress")
        .upsert({ student_id: user.id, lesson_id: lesson.id });
      if (error) {
        alert("حصل خطأ في تسجيل تقدمك: " + error.message);
        return;
      }
      setCompletedLessonIds((ids) => [...ids, lesson.id]);
    }
  }

  // جرس الإشعارات: بينادَى تلقائيًا عند إضافة درس/ملزمة جديدة، أو يدويًا
  // من لوحة الأدمن لإرسال إعلان عام.
  async function pushNotification(title, body, channelId) {
    const { data: inserted, error } = await supabaseClient
      .from("notifications")
      .insert({ title, body, channel_id: channelId || null })
      .select()
      .single();
    if (!error && inserted) {
      setNotifications((n) => [inserted, ...n]);
      setUnreadNotifCount((c) => c + 1);
    }
  }

  function markNotificationsSeen() {
    try {
      localStorage.setItem("omran_last_seen_notif", new Date().toISOString());
    } catch (e) {}
    setUnreadNotifCount(0);
  }

  async function postDiscussion() {
    const text = newDiscussionText.trim();
    if (!text || !selectedChannelId) return;
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      alert("لازم تكون مسجل دخول عشان تكتب في غرفة النقاش.");
      return;
    }
    setPostingDiscussion(true);
    const { data: inserted, error } = await supabaseClient
      .from("discussions")
      .insert({ student_id: user.id, student_name: student.name || "طالب", body: text, channel_id: selectedChannelId })
      .select()
      .single();
    setPostingDiscussion(false);
    if (error) {
      alert("حصل خطأ في نشر مشاركتك: " + error.message + "\n(تأكد إنك شغّلت كود إعداد وتحديث جدول غرف النقاش في Supabase)");
      return;
    }
    setDiscussions((d) => [inserted, ...d]);
    setNewDiscussionText("");
  }

  async function deleteDiscussion(id) {
    await supabaseClient.from("discussions").delete().eq("id", id);
    setDiscussions((d) => d.filter((x) => x.id !== id));
  }

  // المساعد الذكي: بيبعت سؤال الطالب لـ Supabase Edge Function اللي بدورها
  // بتكلم Gemini بمفتاح سري (مش موجود هنا في كود الموقع خالص). كل مادة ليها
  // محادثة منفصلة عن باقي المواد (مخزنة محليًا في المتصفح بس، مش في قاعدة البيانات).
  async function sendAiMessage() {
    const question = aiInput.trim();
    const channelId = selectedChannelId;
    if (!question || aiLoading || !channelId) return;
    setAiInput("");
    const updated = [...aiMessages, { role: "user", content: question }];
    setAiMessagesByChannel((m) => ({ ...m, [channelId]: updated }));
    setAiLoading(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/ai-tutor`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          apikey: SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ question, subject: selectedChannel?.name || "" }),
      });
      const data = await res.json();
      const reply = data?.reply || data?.error || "عذراً، حصل خطأ في الرد، حاول تاني.";
      setAiMessagesByChannel((m) => ({ ...m, [channelId]: [...(m[channelId] || updated), { role: "model", content: reply }] }));
    } catch (e) {
      setAiMessagesByChannel((m) => ({ ...m, [channelId]: [...(m[channelId] || updated), { role: "model", content: "عذراً، تعذر الاتصال بالمساعد الذكي حاليًا." }] }));
    } finally {
      setAiLoading(false);
    }
  }

  function deleteChannel(channelId) {
    setChannels((cs) => {
      const remaining = cs.filter((c) => c.id !== channelId);
      if (channelId === selectedChannelId) {
        setSelectedChannelId(remaining.length ? remaining[0].id : null);
      }
      return remaining;
    });
    supabaseClient
      .from("channels")
      .delete()
      .eq("id", channelId)
      .then(({ error }) => {
        if (error) console.error("تعذر حذف المادة من القاعدة:", error.message);
      });
  }

  async function generateCode(channelId) {
    const code = Math.random().toString(36).slice(2, 10).toUpperCase();
    const channelName = channels.find((c) => c.id === channelId)?.name || "";

    // نحفظ الكود في قاعدة البيانات (Supabase) عشان يبقى شغال من أي جهاز
    const { error } = await supabaseClient.from("access_codes").insert({
      code,
      channel_id: channelId,
      channel_name: channelName,
    });
    if (error) {
      alert("حصل خطأ في توليد الكود: " + error.message);
      return;
    }

    setChannels((cs) =>
      cs.map((c) =>
        c.id === channelId
          ? { ...c, codes: [...(c.codes || []), { code, used: false }] }
          : c
      )
    );
  }

  async function deleteCode(channelId, code) {
    await supabaseClient.from("access_codes").delete().eq("code", code);
    setChannels((cs) =>
      cs.map((c) =>
        c.id === channelId
          ? { ...c, codes: (c.codes || []).filter((cc) => cc.code !== code) }
          : c
      )
    );
  }

  async function redeemCode() {
    if (!selectedChannel) return;
    const trimmed = codeInput.trim().toUpperCase();

    // نتحقق من الكود في قاعدة البيانات الحقيقية (مش الذاكرة المحلية)
    // عشان يشتغل حتى لو الأدمن ولّد الكود من جهاز/تاب تاني
    const { data: matchRows, error: fetchError } = await supabaseClient
      .from("access_codes")
      .select("*")
      .eq("code", trimmed)
      .eq("channel_id", selectedChannel.id)
      .eq("used", false)
      .limit(1);

    if (fetchError || !matchRows || matchRows.length === 0) {
      setCodeError("الكود غلط أو مستخدم قبل كده. تأكد منه مع الأستاذ.");
      return;
    }

    // نسجّل اشتراك الطالب في المادة عشان يفضل مفتوح ليه حتى بعد Refresh —
    // لازم ده ينجح قبل ما نعتبر الكود اتفتح، عشان مايحصلش إن الكود يتحرق
    // من غير ما الاشتراك يتسجل فعليًا (زي ما كان بيحصل بسبب صلاحيات RLS ناقصة)
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      setCodeError("لازم تكون مسجل دخول عشان تفتح المادة. جرب تسجل دخول تاني.");
      return;
    }

    // "علاج ذاتي" قبل تسجيل الاشتراك: لو حساب الطالب ده (لأي سبب) مفيهوش
    // صف في جدول public.students، تسجيل الاشتراك هيفشل برسالة
    // "foreign key constraint" لأن enrollments مربوطة بالطالب في الجدول ده.
    // فبنتأكد إن الصف موجود (أو ننشئه من بيانات الطالب المحفوظة عندنا) قبل
    // أي محاولة تسجيل اشتراك.
    const { error: selfHealError } = await supabaseClient.from("students").upsert({
      id: user.id,
      name: student.name || "",
      phone: student.phone || "",
      email: student.email || user.email || "",
    });
    if (selfHealError) {
      setCodeError(
        "حصل خطأ في التأكد من حسابك، جرب تسجل خروج وتدخل تاني: " + selfHealError.message
      );
      return;
    }

    const { error: enrollError } = await supabaseClient.from("enrollments").upsert({
      student_id: user.id,
      channel_id: selectedChannel.id,
    });

    if (enrollError) {
      setCodeError("حصل خطأ في تسجيل الاشتراك: " + enrollError.message);
      return;
    }

    await supabaseClient
      .from("access_codes")
      .update({ used: true, used_by: user.id })
      .eq("code", trimmed);

    setChannels((cs) =>
      cs.map((c) =>
        c.id === selectedChannel.id
          ? {
              ...c,
              codes: [...(c.codes || []).filter((cc) => cc.code !== trimmed), { code: trimmed, used: true }],
            }
          : c
      )
    );
    setUnlockedChannelIds((u) => [...u, selectedChannel.id]);
    setCodeInput("");
    setCodeError("");
  }
